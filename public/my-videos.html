<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My videos | RapVideo</title>
<style>
:root{
  --ink:#111113; --ink2:#5a5a63; --ink3:#8b8b95;
  --line:#e6e6ea; --line2:#d0d0d7;
  --bg:#ffffff; --bg2:#f7f7f9;
  --brand:#5b3df5; --brand-soft:#f0edff;
  --ok:#0f6e56; --warn:#854f0b; --bad:#b42318;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:0 24px}
a{color:inherit;text-decoration:none}
header{border-bottom:0.5px solid var(--line);position:sticky;top:0;
  background:rgba(255,255,255,.92);backdrop-filter:blur(10px);z-index:50}
.nav{display:flex;align-items:center;justify-content:space-between;height:62px}
.logo{font-size:17px;font-weight:600;letter-spacing:-.3px}
.logo span{color:var(--brand)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:0.5px solid var(--line2);background:transparent;color:var(--ink);
  padding:9px 16px;border-radius:9px;font-size:14px;cursor:pointer;
  font-family:inherit;transition:all .15s}
.btn:hover{background:var(--bg2)}
.btn-p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn-p:hover{background:#4a2fe0}
.btn-sm{padding:6px 12px;font-size:13px}

.top{padding:44px 0 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-size:30px;letter-spacing:-.8px;font-weight:650}
.who{font-size:13px;color:var(--ink3);margin-top:4px}

.empty{background:var(--bg2);border:0.5px solid var(--line);border-radius:var(--r);
  padding:40px 24px;text-align:center;margin:26px 0 60px}
.empty h2{font-size:19px;font-weight:600;margin-bottom:8px}
.empty p{color:var(--ink2);font-size:14px;margin-bottom:20px}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:26px 0 60px}
.item{border:0.5px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff}
.item video{width:100%;aspect-ratio:9/16;object-fit:cover;background:#0d0d10;display:block}
.ph{width:100%;aspect-ratio:9/16;background:var(--bg2);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;color:var(--ink3);font-size:13px;text-align:center;padding:20px}
.spin{width:18px;height:18px;border:2px solid var(--line2);border-top-color:var(--brand);
  border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.body{padding:13px 15px}
.topic{font-size:14px;font-weight:500;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:8px;justify-content:space-between}
.pill{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--bg2);color:var(--ink2);border:0.5px solid var(--line)}
.pill.done{background:#ecfdf3;color:var(--ok);border-color:#bbf7d0}
.pill.run{background:var(--brand-soft);color:var(--brand);border-color:#ddd6fe}
.pill.fail{background:#fef3f2;color:var(--bad);border-color:#fecdc9}
.dl{font-size:12.5px;color:var(--brand);margin-top:8px;display:inline-block}

.msg{border-radius:10px;padding:12px 15px;font-size:14px;margin:20px 0;display:none}
.msg.show{display:block}
.msg.err{background:#fef3f2;border:0.5px solid #fecdc9;color:var(--bad)}
@media(max-width:720px){.grid{grid-template-columns:1fr 1fr}}
</style>
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/ui.css">

</head>
<body>

<header>
  <div class="wrap nav">
    <a class="logo" href="/">Rap<span>Video</span></a>
    <div style="display:flex;gap:10px;align-items:center">
      <span id="who" style="font-size:13px;color:var(--ink3)"></span>
      <button class="btn btn-sm" id="outBtn" style="display:none" onclick="signOut()">Sign out</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="top">
    <div>
      <h1>My videos</h1>
      <div class="who" id="who2"></div>
    </div>
    <a class="btn btn-p" href="/#make">Make a new one</a>
  </div>

  <div class="msg" id="msg"></div>

  <div class="empty" id="gate" style="display:none">
    <h2>Sign in to see your videos</h2>
    <p>Your videos live in your account, so you can come back and download them later.</p>
    <a class="btn btn-p" href="/auth.html?next=/my-videos.html">Sign in</a>
  </div>

  <div class="empty" id="none" style="display:none">
    <h2>Nothing here yet</h2>
    <p>Every video you make shows up on this page, ready to download.</p>
    <a class="btn btn-p" href="/#make">Make your first rap video</a>
  </div>

  <div class="grid" id="grid"></div>
</div>

<script>
var user = null;

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c];
  });
}

function statusPill(o){
  if (o.status === 'done') return '<span class="pill done">Ready</span>';
  if (o.status === 'running') return '<span class="pill run">' + esc(o.step || 'working') + '</span>';
  if (o.status === 'failed') return '<span class="pill fail">Failed</span>';
  if (o.status === 'paid') return '<span class="pill run">queued</span>';
  return '<span class="pill">awaiting payment</span>';
}

function card(o){
  var media;
  if (o.videoUrl) {
    media = '<video src="' + esc(o.videoUrl) + '" controls playsinline preload="metadata"></video>';
  } else if (o.status === 'running' || o.status === 'paid') {
    media = '<div class="ph"><div class="spin"></div><span>Generating &middot; ' + esc(o.step || 'queued') + '</span></div>';
  } else if (o.status === 'failed') {
    media = '<div class="ph">Generation failed.<br>We refund failed renders automatically.</div>';
  } else {
    media = '<div class="ph">Payment not completed.</div>';
  }
  var date = new Date(o.createdAt).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
  return '<div class="item">' + media +
    '<div class="body"><div class="topic">' + esc(o.topic || 'Untitled rap') + '</div>' +
    '<div class="meta"><span>' + date + '</span>' + statusPill(o) + '</div>' +
    (o.videoUrl ? '<a class="dl" href="' + esc(o.videoUrl) + '" download>Download MP4</a>' : '') +
    '</div></div>';
}

function render(list){
  var grid = document.getElementById('grid');
  document.getElementById('none').style.display = list.length ? 'none' : 'block';
  grid.innerHTML = list.map(card).join('');
}

function load(){
  fetch('/api/my/orders').then(function(r){ return r.json(); }).then(function(r){
    if (!r.ok) return;
    render(r.orders || []);
    // keep polling while anything is still cooking
    if ((r.orders || []).some(function(o){ return o.status === 'running' || o.status === 'paid'; })) {
      setTimeout(load, 6000);
    }
  }).catch(function(){});
}

function signOut(){
  fetch('/api/auth/logout', { method: 'POST' }).then(function(){ location.href = '/'; });
}

(function init(){
  fetch('/api/auth/me').then(function(r){ return r.json(); }).then(function(r){
    if (!r.user) {
      document.getElementById('gate').style.display = 'block';
      return;
    }
    user = r.user;
    document.getElementById('who').textContent = user.email;
    document.getElementById('who2').textContent = 'Signed in as ' + user.email;
    document.getElementById('outBtn').style.display = 'inline-flex';
    load();
  }).catch(function(){
    document.getElementById('gate').style.display = 'block';
  });
})();
</script>
</body>
</html>
